services:
  ai-service:
    build: ./ai_service
    ports:
      - "8000:8000"
    environment:
      allow_origins: '["http://localhost:3000", "http://parking-spot-interface:3000"]'
      allow_methods: '["*"]'
      allow_headers: '["*"]'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      REDIS_OCCUPANCY_TTL_SECONDS: 60
      CACHE_TTL_SECONDS: 300
      IOU_THRESHOLD: 0.3
    depends_on:
      - postgres
      - redis

  parking-spot-interface:
    build:
      context: ./parking_spot_interface
      args:
        BACKEND_URL: http://ai-service:8000
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://ai-service:8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: parking-spot-images
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - ai-service
      - postgres
      - localstack

  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack_data:/var/lib/localstack
